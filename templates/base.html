<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Cine do Botecão{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-icon">▶</span> Cine do Botecão
      </a>
      <nav>
        <a href="/#fila">Na Fila</a>
        <a href="/#vistos">Já Vistos</a>
        <a href="/#recomendacoes">Recomendações</a>
      </nav>
    </div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy">Cine do Botecão &middot; Histórico do Discord &middot; Dados via TMDB</p>
      <div class="backup-panel">
        <p class="backup-panel__title">Gerenciar dados</p>
        <p class="backup-panel__hint">Exporte antes de deploys e restaure se a base for perdida.</p>
        <div class="backup-panel__actions">
          <button type="button" id="backup-export-btn" class="backup-btn">⬇️ Exportar backup</button>
          <button type="button" id="backup-import-btn" class="backup-btn backup-btn--danger">📥 Importar backup</button>
          <input type="file" id="backup-import-file" accept=".json,application/json" hidden />
        </div>
        <p id="backup-status" class="backup-panel__status"></p>
      </div>
    </div>
  </footer>

  <!-- Trailer Modal -->
  <div id="trailer-modal" class="modal" aria-hidden="true" role="dialog">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Fechar">&#x2715;</button>
      <iframe id="trailer-iframe" src="" frameborder="0"
              allow="autoplay; encrypted-media; fullscreen"
              allowfullscreen></iframe>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
